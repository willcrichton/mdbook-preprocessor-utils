[workspace]
resolver = "2"
members = [".", "example/mdbook-example"]

[package]
name = "mdbook-preprocessor-utils"
version = "0.3.0"
authors = ["Will Crichton <crichton.will@gmail.com>"]
description = "Utilities for writing mdBook preprocessors"
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/willcrichton/mdbook-preprocessor-utils"

[features]
testing = ["tempfile", "mdbook-driver"]

[dependencies]
clap = {version = "4", default-features = false, features = ["std"]}
mdbook-driver = {version = "0.5", default-features = false, optional = true}
mdbook-preprocessor = {version = "0.5", default-features = false}
semver = "1"
anyhow = "1"
rayon = "1"
serde_json = "1"
tempfile = {version = "3", optional = true}
env_logger = "0.10"
log = "0.4"
chrono = "0.4"
html-escape = "0.2"
serde = "1"
